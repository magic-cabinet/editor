name: magic-cabinet-dev

services:
  showroom:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    cpus: "${MAGIC_CABINET_CPUS:-2.0}"
    mem_limit: "${MAGIC_CABINET_MEMORY:-2g}"
    environment:
      NEXT_PUBLIC_PASCAL_PRODUCT_PROFILE: magic-cabinet
      PASCAL_DATA_DIR: /data
      PASCAL_MCP_HTTP_TOKEN: ${PASCAL_MCP_HTTP_TOKEN:-magic-cabinet-dev}
      PASCAL_MCP_LOCAL_WORKSPACE: "1"
    ports:
      - "${MAGIC_CABINET_PORT:-8080}:8080"
    volumes:
      - pascal-data:/data
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  pascal-data:

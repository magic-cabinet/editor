name: magic-cabinet-dev

services:
  showroom:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_PASCAL_PRODUCT_PROFILE: magic-cabinet
      PASCAL_DATA_DIR: /data
      PASCAL_MCP_HTTP_TOKEN: ${PASCAL_MCP_HTTP_TOKEN:?PASCAL_MCP_HTTP_TOKEN must be set}
      PASCAL_MCP_LOCAL_WORKSPACE: "1"
    ports:
      - "127.0.0.1:${MAGIC_CABINET_PORT:-8080}:8080"
    volumes:
      - pascal-data:/data
    restart: unless-stopped

volumes:
  pascal-data:
